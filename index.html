
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08152e" />
  <meta name="description" content="Discover the universe through NASA's Astronomy Picture of the Day." />
  <title>NASA Space Explorer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
      <p>Discover the universe, one day at a time.</p>
    </header>

    <section class="explore-panel">
      <div class="panel-heading">
        <h2>Explore the Cosmos</h2>
        <p>Choose a date range to discover NASA's astronomy photos.</p>
      </div>

      <div class="filters">
        <label for="startDate">
          Start Date
          <input type="date" id="startDate" />
        </label>

        <label for="endDate">
          End Date
          <input type="date" id="endDate" />
        </label>

        <button id="fetchButton">Get Space Images</button>
      </div>
    </section>

    <section class="fact-section">
      <span class="fact-label">DID YOU KNOW?</span>
      <p id="spaceFact"></p>
    </section>

    <div class="gallery-heading">
      <h2>Gallery</h2>
      <span id="galleryCount"></span>
    </div>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and start exploring the cosmos!</p>
      </div>
    </div>

    <footer class="site-footer">
      <p>Exploring the universe with NASA's Astronomy Picture of the Day</p>
      <button id="notificationButton" class="secondary-button">Enable Notifications</button>
      <button id="installButton" class="secondary-button" hidden>Install App</button>
    </footer>
  </div>

  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-content">
      <button id="closeModal" class="close-modal" aria-label="Close">×</button>
      <div id="modalMedia"></div>
      <div class="modal-details">
        <span id="modalDate"></span>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
